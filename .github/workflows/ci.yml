name: CI

on:
  push:
    branches: [main, master]
  # Deliberately unfiltered by base branch. A `branches:` filter here skips
  # stacked pull requests — one whose base is another feature branch — and the
  # skip is silent: `gh pr view` reports an empty check rollup while
  # mergeStateStatus still says CLEAN, so the PR looks merely pending and can
  # be merged having never been tested once.
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  card-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The card tests (one per certified card, exercising its DSL effects) are
      # ~65% of the suite but are excluded from `npm test`. Gate them here so a
      # DSL/resolver/card-data change can't silently break dozens of cards.
      - name: Card tests
        run: npm run test:nightly
